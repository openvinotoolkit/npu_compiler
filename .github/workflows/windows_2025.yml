name: Windows (2025)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - releases/**

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref_name }}-2025
  cancel-in-progress: true

permissions: read-all

jobs:
  Windows2025:
    name: Main Trigger (2025)
    uses: ./.github/workflows/job_windows.yml
    permissions:
      actions: read
      contents: read
      packages: read
      statuses: read
      security-events: write
      id-token: write
      attestations: write
    with:
      os: windows_2025
      build-runner: windows-2025-16-core
      build-cache: true
      build-cache-key-suffix: ${{ github.sha }}
      build-cid: true
